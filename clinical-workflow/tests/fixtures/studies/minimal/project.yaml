    reviewers: ["qc_programmer", "lead_programmer"]
    consensus: "all_must_approve"
  submission:
    reviewers: ["lead_programmer", "regulatory_lead"]
    consensus: "all_must_approve"

paths:
  input_dir: "input"
  output_dir: "output"
  review_queue_dir: ".review_queue"
