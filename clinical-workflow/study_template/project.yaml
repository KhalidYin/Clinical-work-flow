study_id: "STUDY-TEMPLATE"
protocol_id: "PROT-TEMPLATE"
trial_phase: "phase_ii"
therapeutic_area: "other"
primary_language: "sas"
qc_language: "r"
sponsor: "Replace before use"
created_at: "2026-07-13T00:00:00Z"
synthetic_only: false

standards:
  sdtm_version: "2.0"
  sdtmig_version: "3.4"
  adam_version: "2.1"
  adamig_version: "1.3"
  ct_version: "2024-03"

source_policy:
  input_json_allowed: false
  accepted_source_storage_formats: ["txt", "md", "pdf", "docx", "csv", "tsv", "xlsx", "xpt", "sas7bdat"]
  current_poc_auto_parse_formats: ["txt", "csv", "sas7bdat"]
  planned_auto_parse_formats: []
  source_requirements: "target_artifact_profile"
  derived_json_root: "work/derived"
  mapping_candidate_root: "work/mapping"
  missing_required_source: "fail_closed"
  raw_input_roots:
    - "input/protocol"
    - "input/sap"
    - "input/edc"
    - "input/external"

programming_chain:
  source_to_target: "edc_to_sdtm"
  test_phase_primary: "python"
  test_phase_qc: "r"
  production_target_primary: "sas"
  production_target_qc: "r"
  dataset_output_format_current_poc: "csv"
  requires_program_manifest: true
  requires_execution_log: true
  requires_provenance: true
  sas_execution: "generate_only_until_runtime_configured"

review_timeout:
  reminder_hours: 24
  escalation_hours: 72
  stale_hours: 168
  stale_action: "pause"

review_assignments:
  sap_review: {reviewers: ["replace_role"], consensus: "all_must_approve"}
  sdtm_spec: {reviewers: ["replace_role"], consensus: "all_must_approve"}
  adam_spec: {reviewers: ["replace_role"], consensus: "all_must_approve"}
  tfl_shell: {reviewers: ["replace_role"], consensus: "all_must_approve"}
  tfl_qc: {reviewers: ["replace_role"], consensus: "all_must_approve"}
  submission: {reviewers: ["replace_role"], consensus: "all_must_approve"}

paths:
  input_dir: "input"
  work_dir: "work"
  program_dir: "programs"
  output_dir: "output"
  review_queue_dir: ".review_queue"
  audit_log: "audit_trail.jsonl"
