        actorId: { type: string }
        action: { type: string }
        objectType: { type: string }
        objectId: { type: string }
        runId: { type: [string, "null"] }
        beforeVersion:
          anyOf:
            - $ref: "#/components/schemas/AuditVersion"
            - type: "null"
        afterVersion:
          anyOf:
            - $ref: "#/components/schemas/AuditVersion"
            - type: "null"
        result: { type: [string, "null"] }
        correlationId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
