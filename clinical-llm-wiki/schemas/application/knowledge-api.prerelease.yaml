openapi: 3.1.0
info:
  title: Clinical Knowledge Ledger API
  version: knowledge-api.prerelease.v1
  description: >-
    P12 P1 prerelease contract for App Shell, Source Registry and Admin identity mapping.
    This contract does not authorize production data or expose Workflow/Agent/Project Memory fields.
servers:
  - url: /api/prerelease/v1
paths:
  /session:
    get:
      operationId: getSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated platform identity and product role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /health:
    get:
      operationId: getPlatformHealth
      security: []
      responses:
        "200":
          description: Explicit platform capability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /releases/current:
    get:
      operationId: getCurrentRelease
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current immutable release pointer and index manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentReleaseResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /sources:
    get:
      operationId: listSources
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registered source versions; never inferred from object keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCollectionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/users:
    get:
      operationId: listPlatformUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product authorization mapping; credentials and raw tokens are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollectionResponse"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-or-verified-oidc
  responses:
    AuthenticationError:
      description: Identity is missing, invalid, unmapped or disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthorizationError:
      description: The internal actor lacks the required product permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required internal repository is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HumanRole:
      enum: [platform_admin, knowledge_curator, reviewer, release_manager, consumer]
    IdentitySource:
      enum: [local_test, oidc]
    PrincipalType:
      const: human
    Permission:
      enum:
        - source:read
        - source:register
        - source:upload
        - processing:read
        - processing:start
        - processing:retry
        - processing:execute
        - object:read
        - object:write_derived
        - evidence:read
        - evidence:write
        - candidate:read
        - candidate:write
        - candidate:submit
        - relation:propose
        - review:decide
        - query:released
        - model:invoke
        - evaluation:run
        - index:build
        - release:build
        - release:publish
        - admin:read
        - admin:manage_users
        - admin:manage_roles
        - admin:manage_service_accounts
        - audit:read
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [contractVersion, fixture, generatedAt]
      properties:
        contractVersion:
          const: knowledge-api.prerelease.v1
        fixture:
          type: boolean
        generatedAt:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required: [actorId, displayName, principalType, roles, organization, permissions]
      properties:
        actorId: { type: string }
        displayName: { type: string }
        principalType: { $ref: "#/components/schemas/PrincipalType" }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/HumanRole" }
        organization: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
    PlatformHealth:
      type: object
      additionalProperties: false
      required: [status, api, database, objectStore, semanticIndex, checkedAt]
      properties:
        status: { enum: [healthy, degraded] }
        api: { $ref: "#/components/schemas/CapabilityState" }
        database: { $ref: "#/components/schemas/CapabilityState" }
        objectStore: { $ref: "#/components/schemas/CapabilityState" }
        semanticIndex: { $ref: "#/components/schemas/CapabilityState" }
        checkedAt: { type: string, format: date-time }
    CapabilityState:
      enum: [available, degraded, disabled]
    CurrentRelease:
      type: object
      additionalProperties: false
      required: [releaseId, version, status, indexVersion, releasedAt]
      properties:
        releaseId: { type: [string, "null"] }
        version: { type: [string, "null"] }
        status: { enum: [released, not_released] }
        indexVersion: { type: [string, "null"] }
        releasedAt: { type: [string, "null"], format: date-time }
    SourceSummary:
      type: object
      additionalProperties: false
      required: [sourceId, title, version, mediaType, rights, status, sourceHash, updatedAt]
      properties:
        sourceId: { type: string }
        title: { type: string }
        version: { type: string }
        mediaType: { enum: [PDF, DOCX, XLSX, Markdown] }
        rights: { enum: [licensed, internal, restricted] }
        status:
          enum: [registered, processing, candidate, approved, released, restricted, disabled]
        sourceHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        updatedAt: { type: string, format: date-time }
    PlatformUser:
      type: object
      additionalProperties: false
      required: [userId, displayName, email, identitySource, roles, status, lastActiveAt]
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        identitySource: { $ref: "#/components/schemas/IdentitySource" }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/HumanRole" }
        status: { enum: [active, disabled] }
        lastActiveAt: { type: [string, "null"], format: date-time }
    SourceCollection:
      type: object
      additionalProperties: false
      required: [items, total, partial, warnings]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SourceSummary" }
        total: { type: integer, minimum: 0 }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    UserCollection:
      type: object
      additionalProperties: false
      required: [items, total, partial, warnings]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformUser" }
        total: { type: integer, minimum: 0 }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    SessionResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Session" }
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PlatformHealth" }
    CurrentReleaseResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/CurrentRelease" }
    SourceCollectionResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SourceCollection" }
    UserCollectionResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UserCollection" }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              enum: [authentication_required, invalid_identity, permission_denied, service_unavailable]
            message: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    Envelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/ResponseMeta" }
