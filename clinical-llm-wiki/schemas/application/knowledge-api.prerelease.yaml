openapi: 3.1.0
info:
  title: Clinical Knowledge Ledger API
  version: knowledge-api.prerelease.v1
  description: >-
    P12 P2-B1 prerelease contract for governed Source Registry, deterministic processing
    runs, evidence-backed candidates, two-person governance and Admin identity mapping.
    This contract does not authorize production data or expose Workflow/Agent/Project Memory fields.
servers:
  - url: /api/prerelease/v1
paths:
  /session:
    get:
      operationId: getSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated platform identity and product role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /health:
    get:
      operationId: getPlatformHealth
      security: []
      responses:
        "200":
          description: Explicit platform capability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /releases/current:
    get:
      operationId: getCurrentRelease
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current immutable release pointer and index manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentReleaseResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /queries:
    post:
      operationId: queryKnowledge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalQueryRequest"
      responses:
        "200":
          description: Explainable governed retrieval result and capability gaps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalQueryResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /contexts:
    post:
      operationId: buildKnowledgeContext
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextBuildRequest"
      responses:
        "200":
          description: Deterministic context package built from the same governed retrieval result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPackageResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidate-submissions:
    post:
      operationId: submitCandidate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateSubmissionRequest"
      responses:
        "202":
          description: De-identified candidate accepted into the prerelease inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateSubmissionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /knowledge-revisions/{knowledge_revision_id}:
    get:
      operationId: getKnowledgeRevision
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: knowledge_revision_id
          required: true
          schema: { type: string }
        - in: query
          name: visibility
          required: false
          schema:
            enum: [released, evaluation]
            default: released
      responses:
        "200":
          description: One governed revision within the selected visibility boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionTraceResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /knowledge-revisions/{knowledge_revision_id}/trace:
    get:
      operationId: traceKnowledgeRevision
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: knowledge_revision_id
          required: true
          schema: { type: string }
        - in: query
          name: visibility
          required: false
          schema:
            enum: [released, evaluation]
            default: released
      responses:
        "200":
          description: Revision to Evidence and SourceVersion trace within one visibility boundary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionTraceResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /sources:
    get:
      operationId: listSources
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registered source versions; never inferred from object keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCollectionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: registerSource
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 160 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - source_id
                - title
                - source_type
                - version
                - rights_classification
                - storage_allowed
                - data_boundary
                - media_type
                - expected_sha256
                - file
              properties:
                source_id: { type: string }
                title: { type: string }
                source_type: { type: string }
                version: { type: string }
                rights_classification: { enum: [licensed, internal, restricted] }
                storage_allowed: { type: boolean }
                data_boundary:
                  enum:
                    - local_processing_only
                    - enterprise_provider_only
                    - external_allowed
                    - prohibited
                media_type: { type: string }
                expected_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                file: { type: string, format: binary }
      responses:
        "202":
          description: Source is canonically registered and a discrete processing run is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRegistrationResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "415":
          $ref: "#/components/responses/InvalidSourceError"
        "422":
          $ref: "#/components/responses/InvalidSourceError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs:
    get:
      operationId: listProcessingRuns
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Discrete durable runs with step and latest-attempt state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingRunCollectionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs/{run_id}:
    get:
      operationId: getProcessingRun
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One durable processing run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingRunResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs/{run_id}/steps/{step_id}/retry:
    post:
      operationId: retryProcessingStep
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
        - in: path
          name: step_id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: A new linked attempt is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs/{run_id}/cancel:
    post:
      operationId: cancelProcessingRun
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: The run and active work are cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidates:
    get:
      operationId: listCandidates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Evidence-backed candidate revisions and their current human gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateCollectionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidates/{candidate_id}:
    get:
      operationId: getCandidate
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Candidate content, canonical evidence and typed relation proposals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateDetailResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidates/{candidate_id}/revisions:
    post:
      operationId: reviseCandidate
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateRevisionRequest" }
      responses:
        "201":
          description: A new Candidate revision supersedes the editable parent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateRevisionResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidates/{candidate_id}/author-confirmation:
    post:
      operationId: confirmCandidateAuthor
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorConfirmationRequest" }
      responses:
        "200":
          description: The human author confirms one exact candidate revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorConfirmationResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /knowledge-revisions/{revision_id}/review-decision:
    post:
      operationId: decideKnowledgeRevision
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: revision_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionRequest" }
      responses:
        "200":
          description: An independent Reviewer decides one exact knowledge revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDecisionResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /relations/query:
    get:
      operationId: queryRelations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: node_id
          schema: { type: [string, "null"], maxLength: 160 }
        - in: query
          name: q
          schema: { type: [string, "null"], maxLength: 240 }
        - in: query
          name: depth
          schema: { type: integer, minimum: 0, maximum: 8, default: 1 }
      responses:
        "200":
          description: Evidence-bound typed relations with a hard two-hop expansion cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationQueryResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /audit-events:
    get:
      operationId: listAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: actor
          schema: { type: [string, "null"], maxLength: 160 }
        - in: query
          name: action
          schema: { type: [string, "null"], maxLength: 160 }
        - in: query
          name: object_type
          schema: { type: [string, "null"], maxLength: 120 }
        - in: query
          name: result
          schema: { type: [string, "null"], maxLength: 120 }
        - in: query
          name: cursor
          schema: { type: [string, "null"], maxLength: 160 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Read-only paginated audit projection without raw details or sensitive text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventCollectionResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/users:
    get:
      operationId: listPlatformUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product authorization mapping; credentials and raw tokens are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollectionResponse"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-or-verified-oidc
  responses:
    AuthenticationError:
      description: Identity is missing, invalid, unmapped or disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthorizationError:
      description: The internal actor lacks the required product permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required internal repository is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: A version, idempotency or lifecycle conflict prevents the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidSourceError:
      description: Source bytes, hash, rights or media facts fail closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: The requested durable record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HumanRole:
      enum: [platform_admin, knowledge_curator, reviewer, release_manager, consumer]
    IdentitySource:
      enum: [local_test, oidc]
    PrincipalType:
      const: human
    Permission:
      enum:
        - source:read
        - source:register
        - source:upload
        - processing:read
        - processing:start
        - processing:retry
        - processing:execute
        - object:read
        - object:write_derived
        - evidence:read
        - evidence:write
        - candidate:read
        - candidate:write
        - candidate:submit
        - relation:propose
        - review:decide
        - query:released
        - model:invoke
        - evaluation:run
        - index:build
        - release:build
        - release:publish
        - admin:read
        - admin:manage_users
        - admin:manage_roles
        - admin:manage_service_accounts
        - audit:read
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [contractVersion, fixture, generatedAt]
      properties:
        contractVersion:
          const: knowledge-api.prerelease.v1
        fixture:
          type: boolean
        generatedAt:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required: [actorId, displayName, principalType, roles, organization, permissions]
      properties:
        actorId: { type: string }
        displayName: { type: string }
        principalType: { $ref: "#/components/schemas/PrincipalType" }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/HumanRole" }
        organization: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
    PlatformHealth:
      type: object
      additionalProperties: false
      required: [status, api, database, objectStore, semanticIndex, checkedAt]
      properties:
        status: { enum: [healthy, degraded] }
        api: { $ref: "#/components/schemas/CapabilityState" }
        database: { $ref: "#/components/schemas/CapabilityState" }
        objectStore: { $ref: "#/components/schemas/CapabilityState" }
        semanticIndex: { $ref: "#/components/schemas/CapabilityState" }
        checkedAt: { type: string, format: date-time }
    CapabilityState:
      enum: [available, degraded, disabled]
    CurrentRelease:
      type: object
      additionalProperties: false
      required: [releaseId, version, status, indexVersion, releasedAt]
      properties:
        releaseId: { type: [string, "null"] }
        version: { type: [string, "null"] }
        status: { enum: [released, not_released] }
        indexVersion: { type: [string, "null"] }
        releasedAt: { type: [string, "null"], format: date-time }
    RetrievalFilters:
      type: object
      additionalProperties: false
      required: [knowledgeTypes, scope, sourceVersionIds, rightsClassifications]
      properties:
        knowledgeTypes:
          type: array
          items: { type: string }
        scope:
          type: object
          additionalProperties: { type: string }
        sourceVersionIds:
          type: array
          items: { type: string }
        rightsClassifications:
          type: array
          items: { type: string }
    RetrievalQueryRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        visibility:
          enum: [released, evaluation]
          default: released
        filters:
          $ref: "#/components/schemas/RetrievalFilters"
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
        relationDepth: { type: integer, minimum: 0, maximum: 2, default: 1 }
        includeVector: { type: boolean, default: true }
    ContextBuildRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        visibility:
          enum: [released, evaluation]
          default: released
        filters:
          $ref: "#/components/schemas/RetrievalFilters"
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
        relationDepth: { type: integer, minimum: 0, maximum: 2, default: 1 }
        includeVector: { type: boolean, default: true }
        maxHits: { type: integer, minimum: 1, maximum: 50, default: 8 }
        maxCharacters:
          type: integer
          minimum: 500
          maximum: 100000
          default: 12000
    CandidateSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - submissionType
        - originSystem
        - originRecordRef
        - summary
        - deidentified
        - idempotencyKey
      properties:
        schemaVersion: { const: 1.0.0, default: 1.0.0 }
        submissionType:
          enum: [correction, observation, rule_gap, proposed_rule]
        originSystem: { type: string, minLength: 1, maxLength: 160 }
        originRecordRef: { type: string, minLength: 1, maxLength: 240 }
        summary: { type: string, minLength: 1, maxLength: 4000 }
        proposedClaim: { type: [string, "null"], maxLength: 8000 }
        scope:
          type: object
          additionalProperties: { type: string }
        sourceReferences:
          type: array
          maxItems: 50
          items: { type: string }
        deidentified: { const: true }
        idempotencyKey: { type: string, minLength: 8, maxLength: 160 }
    CandidateSubmission:
      type: object
      additionalProperties: false
      required:
        - submissionId
        - status
        - payloadSha256
        - duplicate
        - createdAt
      properties:
        submissionId: { type: string }
        status: { const: received }
        payloadSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        duplicate: { type: boolean }
        createdAt: { type: string, format: date-time }
    RetrievalReleaseScope:
      type: object
      additionalProperties: false
      required: [releaseId, version, indexVersion]
      properties:
        releaseId: { type: string }
        version: { type: string }
        indexVersion: { type: string }
    RetrievalChannelCapability:
      type: object
      additionalProperties: false
      required: [channel, state, version, reason, candidateCount]
      properties:
        channel: { enum: [metadata, fts, vector, relation] }
        state: { enum: [available, degraded, disabled, unavailable] }
        version: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        candidateCount: { type: integer, minimum: 0 }
    QueryPlan:
      type: object
      additionalProperties: false
      required:
        - queryId
        - normalizedQuery
        - visibility
        - releaseScope
        - policyVersion
        - requestedLimit
        - relationDepth
        - channels
        - indexVersion
      properties:
        queryId: { type: string }
        normalizedQuery: { type: string }
        visibility: { enum: [released, evaluation] }
        releaseScope:
          oneOf:
            - $ref: "#/components/schemas/RetrievalReleaseScope"
            - type: "null"
        policyVersion: { type: string }
        requestedLimit: { type: integer, minimum: 1, maximum: 50 }
        relationDepth: { type: integer, minimum: 0, maximum: 2 }
        channels:
          type: array
          items: { $ref: "#/components/schemas/RetrievalChannelCapability" }
        indexVersion: { type: [string, "null"] }
    RetrievalCitation:
      type: object
      additionalProperties: false
      required:
        - evidenceId
        - sourceId
        - sourceTitle
        - sourceVersionId
        - sourceVersion
        - locator
        - contentSha256
        - sourceSha256
        - rightsClassification
        - citationRequired
      properties:
        evidenceId: { type: string }
        sourceId: { type: string }
        sourceTitle: { type: string }
        sourceVersionId: { type: string }
