        gaps:
          type: array
          items: { $ref: "#/components/schemas/ExplicitGap" }
        renderedText: { type: string }
        truncated: { type: boolean }
        partial: { type: boolean }
        maxCharacters: { type: integer, minimum: 500, maximum: 100000 }
    RevisionTrace:
      type: object
      additionalProperties: false
      required: [hit, releaseScope]
      properties:
        hit: { $ref: "#/components/schemas/RetrievalHit" }
        releaseScope:
          oneOf:
            - $ref: "#/components/schemas/RetrievalReleaseScope"
            - type: "null"
    SourceSummary:
      type: object
      additionalProperties: false
      required: [sourceId, title, version, mediaType, rights, status, sourceHash, updatedAt]
      properties:
        sourceId: { type: string }
        title: { type: string }
        version: { type: string }
        mediaType: { enum: [PDF, DOCX, XLSX, Markdown] }
        rights: { enum: [licensed, internal, restricted] }
        status:
          enum: [registered, processing, candidate, approved, released, restricted, disabled]
        sourceHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        updatedAt: { type: string, format: date-time }
    ObjectReference:
      type: object
      additionalProperties: false
      required: [objectKey, sha256, mediaType, sizeBytes, artifactRole]
      properties:
        objectKey: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        mediaType: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        artifactRole: { enum: [original, derived] }
    SourceRegistration:
      type: object
      additionalProperties: false
      required: [sourceId, sourceVersionId, runId, status, originalObject]
      properties:
        sourceId: { type: string }
        sourceVersionId: { type: string }
        runId: { type: string }
        status: { const: queued }
        originalObject: { $ref: "#/components/schemas/ObjectReference" }
    ProcessingAttempt:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - attemptNumber
        - status
        - errorType
        - checkpoint
        - artifactCount
      properties:
        attemptId: { type: string }
        attemptNumber: { type: integer, minimum: 1 }
        status: { enum: [queued, leased, succeeded, failed, expired, cancelled] }
        errorType: { type: [string, "null"] }
        checkpoint: { type: [object, "null"] }
        artifactCount: { type: integer, minimum: 0 }
    ProcessingStep:
      type: object
      additionalProperties: false
      required: [stepId, stepKey, pool, status, dependsOn, latestAttempt]
      properties:
        stepId: { type: string }
        stepKey: { type: string }
        pool: { enum: [document, enrichment, release] }
        status: { enum: [queued, processing, succeeded, failed, cancelled] }
        dependsOn:
          type: array
          items: { type: string }
        latestAttempt: { $ref: "#/components/schemas/ProcessingAttempt" }
    ProcessingRun:
      type: object
      additionalProperties: false
      required:
        - runId
        - sourceVersionId
        - status
        - createdAt
        - updatedAt
        - originalArtifactCount
        - derivedArtifactCount
        - evidenceCount
        - steps
      properties:
        runId: { type: string }
        sourceVersionId: { type: string }
        status:
          enum:
            - queued
            - processing
            - evidence_ready
            - author_confirmation_required
            - review_required
            - approved
            - release_blocked
            - released
            - failed
            - cancelled
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        originalArtifactCount: { type: integer, minimum: 0 }
        derivedArtifactCount: { type: integer, minimum: 0 }
        evidenceCount: { type: integer, minimum: 0 }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ProcessingStep" }
    ProcessingRunCollection:
      type: object
      additionalProperties: false
      required: [items, total, partial, warnings]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProcessingRun" }
        total: { type: integer, minimum: 0 }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    CandidateSummary:
      type: object
      additionalProperties: false
      required:
        - candidateId
        - candidateGroupId
        - runId
        - revisionNumber
        - status
        - knowledgeType
        - claim
        - scope
        - applicability
        - contentSha256
        - evidenceCount
        - relationProposalCount
        - authorActorId
        - knowledgeRevisionId
        - reviewStatus
      properties:
        candidateId: { type: string }
        candidateGroupId: { type: string }
        runId: { type: string }
        revisionNumber: { type: integer, minimum: 1 }
        status:
          enum: [author_confirmation_required, author_confirmed, superseded]
        knowledgeType: { type: string }
        claim: { type: string }
        scope: { type: object }
        applicability: { type: object }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        evidenceCount: { type: integer, minimum: 1 }
        relationProposalCount: { type: integer, minimum: 0 }
        authorActorId: { type: [string, "null"] }
        knowledgeRevisionId: { type: [string, "null"] }
        reviewStatus:
          type: [string, "null"]
          enum:
            - review_required
            - approved
            - rejected
            - changes_requested
            - released
            - superseded
            - retired
            - null
    CandidateCollection:
      type: object
      additionalProperties: false
      required: [items, total, partial, warnings]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CandidateSummary" }
        total: { type: integer, minimum: 0 }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    CandidateEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, sourceVersionId, locator, content, contentSha256, rights]
      properties:
        evidenceId: { type: string }
        sourceVersionId: { type: string }
        locator: { type: object }
        content: { type: string }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        rights: { type: object }
    CandidateRelationProposal:
      type: object
      additionalProperties: false
      required: [relationType, targetKnowledgeUnitId, evidenceIds, status]
      properties:
        relationType:
          enum:
            - applies_to
            - conflicts_with
            - depends_on
            - derived_from
            - supersedes
            - supports
            - used_by
        targetKnowledgeUnitId: { type: string }
        evidenceIds:
          type: array
          items: { type: string }
        status: { enum: [proposed, accepted, rejected, superseded] }
    CandidateAdvisorySignal:
      type: object
      additionalProperties: false
      required: [signalType, description, targetKnowledgeUnitId, evidenceIds]
      properties:
        signalType:
          enum: [possible_duplicate, possible_conflict, explicit_gap]
        description: { type: string, minLength: 1, maxLength: 2000 }
        targetKnowledgeUnitId: { type: [string, "null"] }
        evidenceIds:
          type: array
          minItems: 1
          items: { type: string }
    CandidateDetail:
      allOf:
        - $ref: "#/components/schemas/CandidateSummary"
