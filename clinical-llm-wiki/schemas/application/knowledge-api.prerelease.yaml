        stableKey: { type: string }
        claim: { type: string }
        rank: { type: integer, minimum: 1 }
        citations:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RetrievalCitation" }
    ContextPackage:
      type: object
      additionalProperties: false
