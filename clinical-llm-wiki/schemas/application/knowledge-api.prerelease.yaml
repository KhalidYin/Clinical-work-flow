        - expectedContentSha256
        - decision
        - idempotencyKey
      properties:
        candidateId: { type: string }
        expectedRevisionNumber: { type: integer, minimum: 1 }
        expectedContentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        decision: { enum: [approved, rejected, changes_requested] }
        idempotencyKey: { type: string, minLength: 8, maxLength: 160 }
        rationale: { type: [string, "null"], maxLength: 4000 }
    ReviewDecision:
