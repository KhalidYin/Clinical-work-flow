          required:
            - parentCandidateId
            - conditions
            - exceptions
            - evidence
            - relationProposals
            - advisorySignals
            - originModelInvocationId
          properties:
            parentCandidateId: { type: [string, "null"] }
            conditions:
              type: array
              items: { type: object }
            exceptions:
              type: array
              items: { type: object }
            evidence:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/CandidateEvidence" }
            relationProposals:
              type: array
              items: { $ref: "#/components/schemas/CandidateRelationProposal" }
            advisorySignals:
              type: array
              items: { $ref: "#/components/schemas/CandidateAdvisorySignal" }
            originModelInvocationId: { type: [string, "null"] }
    RelationEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, sourceVersionId, locator, content, contentSha256]
      properties:
        evidenceId: { type: string }
        sourceVersionId: { type: string }
        locator: { type: object }
        content: { type: string }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    RelationNode:
      type: object
      additionalProperties: false
      required:
        - knowledgeUnitId
        - stableKey
        - knowledgeType
        - knowledgeRevisionId
        - revisionNumber
        - status
        - claim
        - releaseIds
      properties:
        knowledgeUnitId: { type: string }
        stableKey: { type: string }
        knowledgeType: { type: string }
        knowledgeRevisionId: { type: [string, "null"] }
        revisionNumber: { type: [integer, "null"], minimum: 1 }
        status:
          enum:
            - unversioned
            - review_required
            - approved
            - rejected
            - changes_requested
            - released
            - superseded
            - retired
        claim: { type: [string, "null"] }
        releaseIds:
          type: array
          items: { type: string }
    RelationEdge:
      type: object
      additionalProperties: false
      required:
        - relationId
        - sourceKnowledgeUnitId
        - targetKnowledgeUnitId
        - relationType
        - status
        - evidence
      properties:
        relationId: { type: string }
        sourceKnowledgeUnitId: { type: string }
        targetKnowledgeUnitId: { type: string }
        relationType:
          enum:
            - applies_to
            - conflicts_with
            - depends_on
            - derived_from
            - supersedes
            - supports
            - used_by
        status: { type: string }
        evidence:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RelationEvidence" }
    RelationQuery:
      type: object
      additionalProperties: false
      required:
        - rootNodeId
        - requestedDepth
        - appliedDepth
        - nodes
        - edges
        - totalNodes
        - truncated
        - partial
        - warnings
      properties:
        rootNodeId: { type: [string, "null"] }
        requestedDepth: { type: integer, minimum: 0 }
        appliedDepth: { type: integer, minimum: 0, maximum: 2 }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/RelationNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/RelationEdge" }
        totalNodes: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
