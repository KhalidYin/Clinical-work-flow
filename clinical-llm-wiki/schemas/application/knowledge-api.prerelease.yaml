      additionalProperties: false
      required: [candidateId, knowledgeRevisionId, revisionStatus, decisionId]
      properties:
        candidateId: { type: string }
        knowledgeRevisionId: { type: string }
        revisionStatus: { enum: [approved, rejected, changes_requested] }
