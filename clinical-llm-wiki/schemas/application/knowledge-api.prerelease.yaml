openapi: 3.1.0
info:
  title: Clinical Knowledge Ledger API
  version: knowledge-api.prerelease.v1
  description: >-
    P12 P2-B1 prerelease contract for governed Source Registry, deterministic processing
    runs, evidence-backed candidates, two-person governance and Admin identity mapping.
    This contract does not authorize production data or expose Workflow/Agent/Project Memory fields.
servers:
  - url: /api/prerelease/v1
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Username/password accepted and an HttpOnly session cookie set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "423": { $ref: "#/components/responses/AuthenticationError" }
  /auth/password/change:
    post:
      operationId: changePassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "200":
          description: Password changed, old sessions revoked and cookie rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "422": { $ref: "#/components/responses/AuthenticationError" }
  /auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        "204": { description: Server-side session revoked and cookie cleared. }
        "401": { $ref: "#/components/responses/AuthenticationError" }
  /session:
    get:
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated platform identity and product role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /health:
    get:
      operationId: getPlatformHealth
      security: []
      responses:
        "200":
          description: Explicit platform capability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /releases/current:
    get:
      operationId: getCurrentRelease
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current immutable release pointer and index manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentReleaseResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /sources:
    get:
      operationId: listSources
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Registered source versions; never inferred from object keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCollectionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: registerSource
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 160 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - source_id
                - title
                - source_type
                - version
                - rights_classification
                - storage_allowed
                - data_boundary
                - media_type
                - expected_sha256
                - file
              properties:
                source_id: { type: string }
                title: { type: string }
                source_type: { type: string }
                version: { type: string }
                rights_classification: { enum: [licensed, internal, restricted] }
                storage_allowed: { type: boolean }
                data_boundary:
                  enum:
                    - local_processing_only
                    - enterprise_provider_only
                    - external_allowed
                    - prohibited
                media_type: { type: string }
                expected_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                file: { type: string, format: binary }
      responses:
        "202":
          description: Source is canonically registered and a discrete processing run is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRegistrationResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "415":
          $ref: "#/components/responses/InvalidSourceError"
        "422":
          $ref: "#/components/responses/InvalidSourceError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs:
    get:
      operationId: listProcessingRuns
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Discrete durable runs with step and latest-attempt state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingRunCollectionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs/{run_id}:
    get:
      operationId: getProcessingRun
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One durable processing run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingRunResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs/{run_id}/steps/{step_id}/retry:
    post:
      operationId: retryProcessingStep
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
        - in: path
          name: step_id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: A new linked attempt is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs/{run_id}/cancel:
    post:
      operationId: cancelProcessingRun
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: The run and active work are cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidates:
    get:
      operationId: listCandidates
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Evidence-backed candidate revisions and their current human gate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateCollectionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidates/{candidate_id}:
    get:
      operationId: getCandidate
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Candidate content, canonical evidence and typed relation proposals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateDetailResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidates/{candidate_id}/revisions:
    post:
      operationId: reviseCandidate
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CandidateRevisionRequest" }
      responses:
        "201":
          description: A new Candidate revision supersedes the editable parent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandidateRevisionResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /candidates/{candidate_id}/author-confirmation:
    post:
      operationId: confirmCandidateAuthor
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: candidate_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorConfirmationRequest" }
      responses:
        "200":
          description: The human author confirms one exact candidate revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorConfirmationResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /knowledge-revisions/{revision_id}/review-decision:
    post:
      operationId: decideKnowledgeRevision
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: revision_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionRequest" }
      responses:
        "200":
          description: An independent Reviewer decides one exact knowledge revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDecisionResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /relations/query:
    get:
      operationId: queryRelations
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: node_id
          schema: { type: [string, "null"], maxLength: 160 }
        - in: query
          name: q
          schema: { type: [string, "null"], maxLength: 240 }
        - in: query
          name: depth
          schema: { type: integer, minimum: 0, maximum: 8, default: 1 }
      responses:
        "200":
          description: Evidence-bound typed relations with a hard two-hop expansion cap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationQueryResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /audit-events:
    get:
      operationId: listAuditEvents
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: actor
          schema: { type: [string, "null"], maxLength: 160 }
        - in: query
          name: action
          schema: { type: [string, "null"], maxLength: 160 }
        - in: query
          name: object_type
          schema: { type: [string, "null"], maxLength: 120 }
        - in: query
          name: result
          schema: { type: [string, "null"], maxLength: 120 }
        - in: query
          name: cursor
          schema: { type: [string, "null"], maxLength: 160 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Read-only paginated audit projection without raw details or sensitive text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventCollectionResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/users:
    get:
      operationId: listPlatformUsers
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Product authorization mapping; credentials and raw tokens are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollectionResponse"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /runtime-knowledge/version:
    get:
      operationId: getPublishedRuntimeKnowledgeVersion
      security:
        - machineCredential: []
      responses:
        "200":
          description: Engine schema bundle identity locked by the current immutable Release.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [bundle_id, bundle_version, bundle_sha256]
                properties:
                  bundle_id: { type: string }
                  bundle_version: { type: string }
                  bundle_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /runtime-knowledge/resolve:
    post:
      operationId: resolvePublishedRuntimeKnowledge
      security:
        - machineCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [study_id, stage, runtime_manifest, schema_bundle]
              properties:
                study_id: { type: string }
                stage: { type: string }
                runtime_manifest: { type: object }
                schema_bundle: { type: object }
                require_workflow: { type: boolean, default: true }
                require_domain: { type: boolean, default: false }
      responses:
        "200":
          description: Engine-validated ExecutionContext projection from locked Release snapshots.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createPlatformUser
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "201":
          description: Local user created; temporary password is returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTemporaryPasswordResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "422": { $ref: "#/components/responses/InvalidSourceError" }
  /admin/users/{user_id}/password/reset:
    post:
      operationId: resetPlatformUserPassword
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Password reset, sessions revoked and temporary password returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTemporaryPasswordResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
  /admin/users/{user_id}/status:
    post:
      operationId: setPlatformUserStatus
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserStatusRequest" }
      responses:
        "200":
          description: User status changed; disabling revokes active sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatusResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "404": { $ref: "#/components/responses/NotFoundError" }
        "422": { $ref: "#/components/responses/InvalidSourceError" }
  /admin/service-accounts:
    get:
      operationId: listServiceAccounts
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Read-only worker identity projection without secret references or values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountCollectionResponse" }
        "401": { $ref: "#/components/responses/AuthenticationError" }
        "403": { $ref: "#/components/responses/AuthorizationError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/model-profiles:
    get:
      operationId: listModelProfiles
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Versioned non-secret model configuration registry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProfileCollectionResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: registerModelProfile
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: X-Correlation-ID
          required: false
          schema: { type: [string, "null"], maxLength: 160 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelProfileRegistrationRequest" }
      responses:
        "201":
          description: Immutable profile version registered without testing or enabling live access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelProfileRegistrationResponse" }
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          description: Configuration facts or references failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    machineCredential:
      type: apiKey
      in: header
      name: X-Knowledge-Machine-Credential
    sessionCookie:
      type: apiKey
      in: cookie
      name: clinical_knowledge_session
  responses:
    AuthenticationError:
      description: Identity is missing, invalid, unmapped or disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthorizationError:
      description: The internal actor lacks the required product permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required internal repository is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: A version, idempotency or lifecycle conflict prevents the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidSourceError:
      description: Source bytes, hash, rights or media facts fail closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: The requested durable record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HumanRole:
      enum: [platform_admin, knowledge_curator, reviewer, release_manager, consumer]
    IdentitySource:
      enum: [local_password, local_test, oidc]
    PrincipalType:
      const: human
    Permission:
      enum:
        - source:read
        - source:register
        - source:upload
        - processing:read
        - processing:start
        - processing:retry
        - processing:execute
        - object:read
        - object:write_derived
        - evidence:read
        - evidence:write
        - candidate:read
        - candidate:write
        - candidate:submit
        - relation:propose
        - review:decide
        - query:released
        - model:invoke
        - evaluation:run
        - index:build
        - release:build
        - release:publish
        - admin:read
        - admin:manage_users
        - admin:manage_roles
        - admin:manage_service_accounts
        - audit:read
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [contractVersion, fixture, generatedAt]
      properties:
        contractVersion:
          const: knowledge-api.prerelease.v1
        fixture:
          type: boolean
        generatedAt:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required:
        - actorId
        - displayName
        - principalType
        - roles
        - organization
        - permissions
        - mustChangePassword
        - sessionExpiresAt
      properties:
        actorId: { type: string }
        displayName: { type: string }
        principalType: { $ref: "#/components/schemas/PrincipalType" }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/HumanRole" }
        organization: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
        mustChangePassword: { type: boolean }
        sessionExpiresAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 160 }
        password: { type: string, format: password, writeOnly: true }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, writeOnly: true }
        newPassword: { type: string, format: password, writeOnly: true }
    PlatformHealth:
      type: object
      additionalProperties: false
      required: [status, api, database, objectStore, semanticIndex, checkedAt]
      properties:
        status: { enum: [healthy, degraded] }
        api: { $ref: "#/components/schemas/CapabilityState" }
        database: { $ref: "#/components/schemas/CapabilityState" }
        objectStore: { $ref: "#/components/schemas/CapabilityState" }
        semanticIndex: { $ref: "#/components/schemas/CapabilityState" }
        checkedAt: { type: string, format: date-time }
    CapabilityState:
      enum: [available, degraded, disabled]
    CurrentRelease:
      type: object
      additionalProperties: false
      required: [releaseId, version, status, indexVersion, releasedAt]
      properties:
        releaseId: { type: [string, "null"] }
        version: { type: [string, "null"] }
        status: { enum: [released, not_released] }
        indexVersion: { type: [string, "null"] }
        releasedAt: { type: [string, "null"], format: date-time }
    SourceSummary:
      type: object
      additionalProperties: false
      required: [sourceId, title, version, mediaType, rights, status, sourceHash, updatedAt]
      properties:
        sourceId: { type: string }
        title: { type: string }
        version: { type: string }
        mediaType: { enum: [PDF, DOCX, XLSX, Markdown] }
        rights: { enum: [licensed, internal, restricted] }
        status:
          enum: [registered, processing, candidate, approved, released, restricted, disabled]
        sourceHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        updatedAt: { type: string, format: date-time }
    ObjectReference:
      type: object
      additionalProperties: false
