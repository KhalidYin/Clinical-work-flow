openapi: 3.1.0
info:
  title: Clinical Knowledge Ledger API
  version: knowledge-api.prerelease.v1
  description: >-
    P12 P2-A prerelease contract for governed Source Registry, deterministic processing
    runs, App Shell and Admin identity mapping.
    This contract does not authorize production data or expose Workflow/Agent/Project Memory fields.
servers:
  - url: /api/prerelease/v1
paths:
  /session:
    get:
      operationId: getSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated platform identity and product role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /health:
    get:
      operationId: getPlatformHealth
      security: []
      responses:
        "200":
          description: Explicit platform capability state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /releases/current:
    get:
      operationId: getCurrentRelease
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current immutable release pointer and index manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentReleaseResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /sources:
    get:
      operationId: listSources
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Registered source versions; never inferred from object keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCollectionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: registerSource
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 160 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - source_id
                - title
                - source_type
                - version
                - rights_classification
                - storage_allowed
                - data_boundary
                - media_type
                - expected_sha256
                - file
              properties:
                source_id: { type: string }
                title: { type: string }
                source_type: { type: string }
                version: { type: string }
                rights_classification: { enum: [licensed, internal, restricted] }
                storage_allowed: { type: boolean }
                data_boundary:
                  enum:
                    - local_processing_only
                    - enterprise_provider_only
                    - external_allowed
                    - prohibited
                media_type: { type: string }
                expected_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
                file: { type: string, format: binary }
      responses:
        "202":
          description: Source is canonically registered and a discrete processing run is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRegistrationResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "415":
          $ref: "#/components/responses/InvalidSourceError"
        "422":
          $ref: "#/components/responses/InvalidSourceError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs:
    get:
      operationId: listProcessingRuns
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Discrete durable runs with step and latest-attempt state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingRunCollectionResponse"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs/{run_id}:
    get:
      operationId: getProcessingRun
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One durable processing run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingRunResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs/{run_id}/steps/{step_id}/retry:
    post:
      operationId: retryProcessingStep
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
        - in: path
          name: step_id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: A new linked attempt is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /processing-runs/{run_id}/cancel:
    post:
      operationId: cancelProcessingRun
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: run_id
          required: true
          schema: { type: string }
      responses:
        "202":
          description: The run and active work are cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/users:
    get:
      operationId: listPlatformUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product authorization mapping; credentials and raw tokens are excluded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollectionResponse"
        "403":
          $ref: "#/components/responses/AuthorizationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-local-or-verified-oidc
  responses:
    AuthenticationError:
      description: Identity is missing, invalid, unmapped or disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthorizationError:
      description: The internal actor lacks the required product permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required internal repository is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: A version, idempotency or lifecycle conflict prevents the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidSourceError:
      description: Source bytes, hash, rights or media facts fail closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: The requested durable record does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HumanRole:
      enum: [platform_admin, knowledge_curator, reviewer, release_manager, consumer]
    IdentitySource:
      enum: [local_test, oidc]
    PrincipalType:
      const: human
    Permission:
      enum:
        - source:read
        - source:register
        - source:upload
        - processing:read
        - processing:start
        - processing:retry
        - processing:execute
        - object:read
        - object:write_derived
        - evidence:read
        - evidence:write
        - candidate:read
        - candidate:write
        - candidate:submit
        - relation:propose
        - review:decide
        - query:released
        - model:invoke
        - evaluation:run
        - index:build
        - release:build
        - release:publish
        - admin:read
        - admin:manage_users
        - admin:manage_roles
        - admin:manage_service_accounts
        - audit:read
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [contractVersion, fixture, generatedAt]
      properties:
        contractVersion:
          const: knowledge-api.prerelease.v1
        fixture:
          type: boolean
        generatedAt:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required: [actorId, displayName, principalType, roles, organization, permissions]
      properties:
        actorId: { type: string }
        displayName: { type: string }
        principalType: { $ref: "#/components/schemas/PrincipalType" }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/HumanRole" }
        organization: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }
    PlatformHealth:
      type: object
      additionalProperties: false
      required: [status, api, database, objectStore, semanticIndex, checkedAt]
      properties:
        status: { enum: [healthy, degraded] }
        api: { $ref: "#/components/schemas/CapabilityState" }
        database: { $ref: "#/components/schemas/CapabilityState" }
        objectStore: { $ref: "#/components/schemas/CapabilityState" }
        semanticIndex: { $ref: "#/components/schemas/CapabilityState" }
        checkedAt: { type: string, format: date-time }
    CapabilityState:
      enum: [available, degraded, disabled]
    CurrentRelease:
      type: object
      additionalProperties: false
      required: [releaseId, version, status, indexVersion, releasedAt]
      properties:
        releaseId: { type: [string, "null"] }
        version: { type: [string, "null"] }
        status: { enum: [released, not_released] }
        indexVersion: { type: [string, "null"] }
        releasedAt: { type: [string, "null"], format: date-time }
    SourceSummary:
      type: object
      additionalProperties: false
      required: [sourceId, title, version, mediaType, rights, status, sourceHash, updatedAt]
      properties:
        sourceId: { type: string }
        title: { type: string }
        version: { type: string }
        mediaType: { enum: [PDF, DOCX, XLSX, Markdown] }
        rights: { enum: [licensed, internal, restricted] }
        status:
          enum: [registered, processing, candidate, approved, released, restricted, disabled]
        sourceHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        updatedAt: { type: string, format: date-time }
    ObjectReference:
      type: object
      additionalProperties: false
      required: [objectKey, sha256, mediaType, sizeBytes, artifactRole]
      properties:
        objectKey: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        mediaType: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        artifactRole: { enum: [original, derived] }
    SourceRegistration:
      type: object
      additionalProperties: false
      required: [sourceId, sourceVersionId, runId, status, originalObject]
      properties:
        sourceId: { type: string }
        sourceVersionId: { type: string }
        runId: { type: string }
        status: { const: queued }
        originalObject: { $ref: "#/components/schemas/ObjectReference" }
    ProcessingAttempt:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - attemptNumber
        - status
        - errorType
        - checkpoint
        - artifactCount
      properties:
        attemptId: { type: string }
        attemptNumber: { type: integer, minimum: 1 }
        status: { enum: [queued, leased, succeeded, failed, expired, cancelled] }
        errorType: { type: [string, "null"] }
        checkpoint: { type: [object, "null"] }
        artifactCount: { type: integer, minimum: 0 }
    ProcessingStep:
      type: object
      additionalProperties: false
      required: [stepId, stepKey, pool, status, dependsOn, latestAttempt]
      properties:
        stepId: { type: string }
        stepKey: { type: string }
        pool: { enum: [document, enrichment, release] }
        status: { enum: [queued, processing, succeeded, failed, cancelled] }
        dependsOn:
          type: array
          items: { type: string }
        latestAttempt: { $ref: "#/components/schemas/ProcessingAttempt" }
    ProcessingRun:
      type: object
      additionalProperties: false
      required:
        - runId
        - sourceVersionId
        - status
        - createdAt
        - updatedAt
        - originalArtifactCount
        - derivedArtifactCount
        - evidenceCount
        - steps
      properties:
        runId: { type: string }
        sourceVersionId: { type: string }
        status:
          enum:
            - queued
            - processing
            - author_confirmation_required
            - review_required
            - approved
            - release_blocked
            - released
            - failed
            - cancelled
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        originalArtifactCount: { type: integer, minimum: 0 }
        derivedArtifactCount: { type: integer, minimum: 0 }
        evidenceCount: { type: integer, minimum: 0 }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ProcessingStep" }
    ProcessingRunCollection:
      type: object
      additionalProperties: false
      required: [items, total, partial, warnings]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProcessingRun" }
        total: { type: integer, minimum: 0 }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    Retry:
      type: object
      additionalProperties: false
      required: [runId, stepId, attemptId, status]
      properties:
        runId: { type: string }
        stepId: { type: string }
        attemptId: { type: string }
        status: { const: queued }
    Cancel:
      type: object
      additionalProperties: false
      required: [runId, status]
      properties:
        runId: { type: string }
        status: { const: cancelled }
    PlatformUser:
      type: object
      additionalProperties: false
      required: [userId, displayName, email, identitySource, roles, status, lastActiveAt]
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        identitySource: { $ref: "#/components/schemas/IdentitySource" }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/HumanRole" }
        status: { enum: [active, disabled] }
        lastActiveAt: { type: [string, "null"], format: date-time }
    SourceCollection:
      type: object
      additionalProperties: false
      required: [items, total, partial, warnings]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SourceSummary" }
        total: { type: integer, minimum: 0 }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    UserCollection:
      type: object
      additionalProperties: false
      required: [items, total, partial, warnings]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PlatformUser" }
        total: { type: integer, minimum: 0 }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    SessionResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Session" }
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/PlatformHealth" }
    CurrentReleaseResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/CurrentRelease" }
    SourceCollectionResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SourceCollection" }
    SourceRegistrationResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/SourceRegistration" }
    ProcessingRunResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProcessingRun" }
    ProcessingRunCollectionResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/ProcessingRunCollection" }
    RetryResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Retry" }
    CancelResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Cancel" }
    UserCollectionResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/UserCollection" }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              enum:
                - authentication_required
                - invalid_identity
                - permission_denied
                - service_unavailable
                - registration_conflict
                - invalid_source
                - unsupported_media
                - run_not_found
                - retry_not_allowed
            message: { type: string }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    Envelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/ResponseMeta" }
