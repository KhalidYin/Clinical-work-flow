        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total: { type: integer, minimum: 0 }
        nextCursor: { type: [string, "null"] }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
