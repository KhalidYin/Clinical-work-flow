        - revisionNumber
        - contentSha256
        - status
      properties:
        candidateId: { type: string }
        parentCandidateId: { type: string }
        revisionNumber: { type: integer, minimum: 2 }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        status: { const: author_confirmation_required }
    AuthorConfirmationRequest:
      type: object
