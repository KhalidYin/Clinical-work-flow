        updatedAt: { type: string, format: date-time }
        originalArtifactCount: { type: integer, minimum: 0 }
        derivedArtifactCount: { type: integer, minimum: 0 }
        evidenceCount: { type: integer, minimum: 0 }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ProcessingStep" }
    ProcessingRunCollection:
      type: object
      additionalProperties: false
      required: [items, total, partial, warnings]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProcessingRun" }
        total: { type: integer, minimum: 0 }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    CandidateSummary:
      type: object
      additionalProperties: false
      required:
        - candidateId
        - candidateGroupId
        - runId
        - revisionNumber
        - status
        - knowledgeType
        - claim
        - scope
        - applicability
        - contentSha256
        - evidenceCount
        - relationProposalCount
        - authorActorId
        - knowledgeRevisionId
        - reviewStatus
      properties:
        candidateId: { type: string }
        candidateGroupId: { type: string }
        runId: { type: string }
        revisionNumber: { type: integer, minimum: 1 }
        status:
          enum: [author_confirmation_required, author_confirmed, superseded]
        knowledgeType: { type: string }
        claim: { type: string }
        scope: { type: object }
        applicability: { type: object }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        evidenceCount: { type: integer, minimum: 1 }
        relationProposalCount: { type: integer, minimum: 0 }
        authorActorId: { type: [string, "null"] }
        knowledgeRevisionId: { type: [string, "null"] }
        reviewStatus:
          type: [string, "null"]
          enum:
            - review_required
            - approved
            - rejected
            - changes_requested
            - released
            - superseded
            - retired
            - null
    CandidateCollection:
      type: object
      additionalProperties: false
      required: [items, total, partial, warnings]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CandidateSummary" }
        total: { type: integer, minimum: 0 }
        partial: { type: boolean }
        warnings:
          type: array
          items: { type: string }
    CandidateEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, sourceVersionId, locator, content, contentSha256, rights]
      properties:
        evidenceId: { type: string }
        sourceVersionId: { type: string }
        locator: { type: object }
        content: { type: string }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        rights: { type: object }
    CandidateRelationProposal:
      type: object
      additionalProperties: false
      required: [relationType, targetKnowledgeUnitId, evidenceIds, status]
      properties:
        relationType:
          enum:
            - applies_to
            - conflicts_with
            - depends_on
            - derived_from
            - supersedes
            - supports
            - used_by
        targetKnowledgeUnitId: { type: string }
        evidenceIds:
          type: array
          items: { type: string }
        status: { enum: [proposed, accepted, rejected, superseded] }
    CandidateAdvisorySignal:
      type: object
      additionalProperties: false
      required: [signalType, description, targetKnowledgeUnitId, evidenceIds]
      properties:
        signalType:
          enum: [possible_duplicate, possible_conflict, explicit_gap]
        description: { type: string, minLength: 1, maxLength: 2000 }
        targetKnowledgeUnitId: { type: [string, "null"] }
        evidenceIds:
          type: array
          minItems: 1
          items: { type: string }
    CandidateDetail:
      allOf:
        - $ref: "#/components/schemas/CandidateSummary"
        - type: object
          required:
            - parentCandidateId
            - conditions
            - exceptions
            - evidence
            - relationProposals
            - advisorySignals
            - originModelInvocationId
          properties:
            parentCandidateId: { type: [string, "null"] }
            conditions:
              type: array
              items: { type: object }
            exceptions:
              type: array
              items: { type: object }
            evidence:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/CandidateEvidence" }
            relationProposals:
              type: array
              items: { $ref: "#/components/schemas/CandidateRelationProposal" }
            advisorySignals:
              type: array
              items: { $ref: "#/components/schemas/CandidateAdvisorySignal" }
            originModelInvocationId: { type: [string, "null"] }
    RelationEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, sourceVersionId, locator, content, contentSha256]
      properties:
        evidenceId: { type: string }
        sourceVersionId: { type: string }
        locator: { type: object }
        content: { type: string }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    RelationNode:
      type: object
      additionalProperties: false
      required:
