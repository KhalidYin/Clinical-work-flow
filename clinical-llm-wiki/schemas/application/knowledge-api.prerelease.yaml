        - knowledgeRevisionId
        - revisionNumber
        - status
        - claim
        - releaseIds
      properties:
        knowledgeUnitId: { type: string }
        stableKey: { type: string }
        knowledgeType: { type: string }
        knowledgeRevisionId: { type: [string, "null"] }
        revisionNumber: { type: [integer, "null"], minimum: 1 }
        status:
          enum:
            - unversioned
            - review_required
            - approved
            - rejected
            - changes_requested
            - released
            - superseded
            - retired
        claim: { type: [string, "null"] }
        releaseIds:
          type: array
          items: { type: string }
    RelationEdge:
      type: object
      additionalProperties: false
      required:
        - relationId
        - sourceKnowledgeUnitId
        - targetKnowledgeUnitId
        - relationType
        - status
        - evidence
      properties:
        relationId: { type: string }
        sourceKnowledgeUnitId: { type: string }
        targetKnowledgeUnitId: { type: string }
        relationType:
          enum:
            - applies_to
            - conflicts_with
            - depends_on
            - derived_from
            - supersedes
            - supports
            - used_by
        status: { type: string }
        evidence:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RelationEvidence" }
    RelationQuery:
      type: object
      additionalProperties: false
      required:
        - rootNodeId
        - requestedDepth
        - appliedDepth
        - nodes
        - edges
        - totalNodes
        - truncated
        - partial
        - warnings
