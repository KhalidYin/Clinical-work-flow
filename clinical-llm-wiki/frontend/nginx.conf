server {
    listen 80;
    server_name _;

    location = / {
        return 302 /app.html;
    }

    location /api/prerelease/v1/ {
        proxy_pass http://api:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app.html;
    }
}
