services:
  harness-egress-deepseek:
    profiles: ["harness"]
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    user: "13:13"
    entrypoint: ["/usr/sbin/squid"]
    command: ["-f", "/etc/squid/squid.conf", "-NYC"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ../harness-runtime/egress/model-deepseek-v1/squid.conf:/etc/squid/squid.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=4m
      - /var/log/squid:rw,noexec,nosuid,size=16m
      - /var/spool/squid:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/3128; printf 'CONNECT health.invalid:443 HTTP/1.1\\r\\nHost: health.invalid:443\\r\\n\\r\\n' >&3; IFS= read -r line <&3; [[ $$line == $$'HTTP/1.1 403 Forbidden\\r' ]]",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - harness-deepseek-client
      - harness-egress-uplink

  p15-openai-mock:
    profiles: ["harness"]
    build: ../harness-runtime
    image: clinical-harness-supervisor:local
    command: ["python", "-m", "poc.openai_mock.server"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      P15_MOCK_API_KEY_FILE: /run/secrets/p15_mock_key
      P15_MOCK_AUDIT_PATH: /var/lib/p15-mock/requests.jsonl
    secrets: ["p15_mock_key"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - p15-mock-audit:/var/lib/p15-mock
    networks: ["harness-model"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  harness-supervisor:
    profiles: ["harness"]
    build: ../harness-runtime
    image: clinical-harness-supervisor:local
    restart: unless-stopped
    depends_on:
      harness-egress-deepseek:
        condition: service_healthy
      p15-openai-mock:
        condition: service_healthy
    environment:
      HARNESS_SUPERVISOR_MACHINE_TOKEN: ${HARNESS_SUPERVISOR_MACHINE_TOKEN:?set a dedicated supervisor machine credential}
      HARNESS_SUPERVISOR_ALLOWED_SPEC_SHA256: ${HARNESS_SUPERVISOR_SPEC_SHA256:?set the approved harness spec SHA-256}
      HARNESS_SUPERVISOR_IMAGE_MANIFEST_PATH: /app/images/opencode-1.18.14.json
      HARNESS_SUPERVISOR_STATE_ROOT: /var/lib/harness-supervisor
      HARNESS_SUPERVISOR_SECRET_ROOT: /run/harness-secrets
      HARNESS_SUPERVISOR_MCP_BRIDGE_PATH: /app/supervisor/mcp_stdio_bridge.sh
      HARNESS_SUPERVISOR_DEEPSEEK_EGRESS_MANIFEST_PATH: /app/egress/model-deepseek-v1/manifest.json
      HARNESS_SUPERVISOR_DEEPSEEK_NETWORK_NAME: clinical-harness-deepseek-client
      HARNESS_SUPERVISOR_DISCOVER_DAEMON_STATE_ROOT: "true"
      HARNESS_SUPERVISOR_LEASE_SECONDS: "30"
      HARNESS_SUPERVISOR_PACK_ID: knowledge-candidate-v1
      HARNESS_SUPERVISOR_PACK_ROOT: /opt/harness-packs/knowledge-candidate-v1
      HARNESS_SUPERVISOR_MODEL_PROVIDER: openai
      HARNESS_SUPERVISOR_MODEL_ID: gpt-4o-mini
      HARNESS_SUPERVISOR_MODEL_BASE_URL: http://p15-openai-mock:8080/v1
      HARNESS_SUPERVISOR_INTERNAL_NETWORK_NAME: clinical-harness-p15-model
      SYNTHETIC_PROVIDER_KEY_FILE: /run/secrets/p15_mock_key
    secrets: ["p15_mock_key"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - harness-supervisor-state:/var/lib/harness-supervisor
      - harness-supervisor-secrets:/run/harness-secrets
      - ./harness-packs/knowledge-candidate-v1:/opt/harness-packs/knowledge-candidate-v1:ro
    networks: ["harness-control"]

  worker-enrichment:
    profiles: ["harness"]
    depends_on:
      harness-supervisor:
        condition: service_healthy
    environment:
      KNOWLEDGE_ENRICHMENT_PROVIDER_MODE: harness
      KNOWLEDGE_HARNESS_EXECUTION_MODE: opencode-supervised
      KNOWLEDGE_HARNESS_SUPERVISOR_URL: http://harness-supervisor:8790
      KNOWLEDGE_HARNESS_SUPERVISOR_TOKEN_REF: env://SUPERVISOR_MACHINE_TOKEN
      SUPERVISOR_MACHINE_TOKEN: ${HARNESS_SUPERVISOR_MACHINE_TOKEN:?set a dedicated supervisor machine credential}
      KNOWLEDGE_HARNESS_SPEC_SHA256: ${HARNESS_SUPERVISOR_SPEC_SHA256:?set the approved harness spec SHA-256}
      KNOWLEDGE_HARNESS_PACK_ID: knowledge-candidate-v1
      KNOWLEDGE_HARNESS_PACK_VERSION: 1.0.0
      KNOWLEDGE_HARNESS_PACK_SHA256: ${HARNESS_PACK_SHA256:?set the measured knowledge-candidate-v1 Pack SHA-256}
    networks: ["default", "harness-control"]

networks:
  harness-control:
    internal: true
  harness-model:
    internal: true
    name: clinical-harness-p15-model
  harness-deepseek-client:
    internal: true
    name: clinical-harness-deepseek-client
  harness-egress-uplink: {}

volumes:
  harness-supervisor-state:
  harness-supervisor-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=0700
  p15-mock-audit:

secrets:
  p15_mock_key:
    file: ${HARNESS_SYNTHETIC_PROVIDER_KEY_FILE:?set a file containing a synthetic non-provider value}
