[project]
name = "clinical-llm-wiki"
version = "0.1.0"
description = "Single-machine governed clinical knowledge vault and local service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "pypdf>=5.0",
    "PyMuPDF>=1.24",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0", "pdfplumber>=0.11", "pytesseract>=0.3"]
dev = ["pytest>=7.0", "httpx>=0.27", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 100
target-version = "py311"
