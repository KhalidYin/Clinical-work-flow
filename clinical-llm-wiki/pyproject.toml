[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-llm-wiki"
version = "0.1.0"
description = "Evidence-driven clinical knowledge application platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "pypdf>=5.0",
    "PyMuPDF>=1.24",
    "Pillow>=10",
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.17,<2",
    "pgvector>=0.4,<1",
    "python-multipart>=0.0.20,<1",
    "argon2-cffi>=25.1,<26",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0", "pdfplumber>=0.11", "pytesseract>=0.3"]
models = ["litellm>=1.92,<2"]
dev = ["pytest>=7.0,<10", "httpx>=0.27", "ruff>=0.8,<0.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["service*", "scripts*"]
