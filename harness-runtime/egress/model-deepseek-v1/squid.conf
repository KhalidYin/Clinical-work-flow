# P16 model endpoint policy: explicit CONNECT only, no TLS interception.
http_port 3128
visible_hostname harness-egress-deepseek

acl CONNECT method CONNECT
acl allowed_tls_port port 443
acl allowed_endpoint dstdomain -n api.deepseek.com
acl blocked_destination dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10
acl blocked_destination dst 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl blocked_destination dst 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16
acl blocked_destination dst 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24
acl blocked_destination dst 224.0.0.0/4 240.0.0.0/4
acl blocked_destination dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8

http_access deny !CONNECT
http_access deny !allowed_tls_port
http_access deny blocked_destination
http_access allow CONNECT allowed_tls_port allowed_endpoint
http_access deny all

# The gateway sees only CONNECT authority and byte counts. It does not decrypt TLS.
cache deny all
pinger_enable off
pid_filename /tmp/squid.pid
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
logfile_rotate 0
forwarded_for delete
shutdown_lifetime 1 seconds
