[project]
name = "clinical-ai-workflow"
version = "0.1.0"
description = "AI-powered clinical statistical programming workflow: Protocol → TFL"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyreadstat>=1.2",
    "pydantic>=2.0",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
