study_id: "SYNTH-E2E-001"
protocol_id: "SYNTH-E2E-PROT-001"
trial_phase: "phase_iii"
therapeutic_area: "synthetic_safety"
primary_language: "python"
qc_language: "r"
sponsor: "Synthetic P11 Sponsor"
created_at: "2026-07-28T00:00:00+08:00"
synthetic_only: true
scaffold_status: "p11_g0_contract_only"

standards:
  sdtm_version: "2.0"
  sdtmig_version: "3.4"
  adam_version: "2.1"
  adamig_version: "1.3"
  ct_version: "p11_snapshot_to_be_locked"

programming_chain:
  source_to_target: "protocol_to_submission"
  test_phase_executor: "python"
  test_phase_qc_artifact: "r"
  production_target_primary: "sas"
  production_target_qc: "r"
  dataset_output_format_current_poc: "csv"
  requires_program_manifest: true
  requires_execution_log: true
  requires_provenance: true
  r_execution: "optional_when_runtime_configured"
  sas_execution: "generate_only_until_runtime_configured"

source_policy:
  input_json_allowed: false
  accepted_source_storage_formats: ["txt", "md", "pdf", "docx", "csv", "tsv", "xlsx", "xpt", "sas7bdat"]
  current_poc_auto_parse_formats: ["txt", "csv", "sas7bdat"]
  source_requirements: "target_artifact_profile"
  derived_json_root: "work/derived"
  mapping_candidate_root: "work/mapping"
  missing_required_source: "fail_closed"
  raw_input_roots:
    - "input/protocol"
    - "input/sap"
    - "input/edc"
    - "input/external"

review_timeout:
  reminder_hours: 24
  escalation_hours: 72
  stale_hours: 168
  stale_action: "pause"

review_assignments:
  sap_review: {reviewers: [clinical_programmer], consensus: all_must_approve}
  sdtm_spec: {reviewers: [lead_programmer, data_manager], consensus: all_must_approve}
  adam_spec: {reviewers: [lead_programmer], consensus: all_must_approve}
  tfl_shell: {reviewers: [lead_programmer], consensus: all_must_approve}
  tfl_qc: {reviewers: [qc_programmer], consensus: all_must_approve}
  submission: {reviewers: [lead_programmer], consensus: all_must_approve}

paths:
  input_dir: "input"
  work_dir: "work"
  program_dir: "programs"
  output_dir: "output"
  review_queue_dir: ".review_queue"
  audit_log: "audit_trail.jsonl"
