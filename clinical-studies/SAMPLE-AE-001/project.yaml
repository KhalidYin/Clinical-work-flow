study_id: "SAMPLE-AE-001"
protocol_id: "SAMPLE-AE-PROT-001"
trial_phase: "phase_iii"
therapeutic_area: "synthetic_safety"
primary_language: "r"
qc_language: "python"
sponsor: "Synthetic Sample Sponsor"
created_at: "2026-07-16T15:10:00+08:00"
synthetic_only: true
scaffold_status: "scaffold_review"

standards:
  sdtm_version: "2.0"
  sdtmig_version: "3.4"
  ct_version: "not_deep_extracted_in_current_poc"

programming_chain:
  source_to_target: "edc_to_sdtm"
  test_phase_primary: "r"
  test_phase_qc: "python"
  production_target_primary: "sas"
  production_target_qc: "r"
  requires_program_manifest: true
  requires_execution_log: true
  requires_provenance: true

source_policy:
  input_json_allowed: false
  derived_json_root: "work/derived"
  mapping_candidate_root: "work/mapping"
  raw_input_roots:
    - "input/protocol"
    - "input/sap"
    - "input/crf"
    - "input/edc"
    - "input/raw"

review_timeout:
  reminder_hours: 24
  escalation_hours: 72
  stale_hours: 168
  stale_action: "continue"

review_assignments:
  source_intake: {reviewers: [clinical_programmer], consensus: all_must_approve}
  parser_output: {reviewers: [clinical_programmer, data_manager], consensus: all_must_approve}
  sdtm_programming: {reviewers: [lead_programmer, qc_programmer], consensus: all_must_approve}
  sdtm_spec: {reviewers: [lead_programmer, data_manager], consensus: all_must_approve}

paths:
  input_dir: "input"
  work_dir: "work"
  program_dir: "programs"
  output_dir: "output"
  review_queue_dir: ".review_queue"
  audit_log: "audit_trail.jsonl"
