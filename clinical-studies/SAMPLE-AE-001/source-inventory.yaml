inventory_id: "source-inventory-sample-ae-001-v0"
status: "scaffold_review"
synthetic_only: true
input_json_allowed: false
review_required_before_execution: true
gate_policy:
  chain: "linear_fail_closed"
  source_intake_required_before_parser: true
  parser_review_required_before_mapping: true
  mapping_review_required_before_programming: true
  program_review_required_before_canonical_output: true
supported_input_formats:
  accepted_source_storage: ["txt", "md", "pdf", "docx", "csv", "tsv", "xlsx", "xpt", "sas7bdat"]
  current_poc_auto_parse: ["txt", "csv"]
  forbidden_in_input: ["json"]
required_source_roles:
  - "study_design_context"
  - "analysis_context"
  - "crf_metadata"
  - "edc_metadata"
  - "ae_source_data"
  - "reference_date_source"
sources:
  - path: "input/protocol/protocol-synopsis.txt"
    source_type: "protocol_excerpt"
    format: "txt"
    role: "study_design_context"
  - path: "input/sap/sap-ae-excerpt.txt"
    source_type: "sap_excerpt"
    format: "txt"
    role: "analysis_context"
  - path: "input/crf/ae-crf-fields.csv"
    source_type: "crf_field_export"
    format: "csv"
    role: "crf_metadata"
  - path: "input/edc/data-dictionary.csv"
    source_type: "edc_data_dictionary"
    format: "csv"
    role: "edc_metadata"
  - path: "input/raw/ae.csv"
    source_type: "edc_raw_export"
    format: "csv"
    role: "ae_source_data"
  - path: "input/raw/subject-reference.csv"
    source_type: "subject_reference_export"
    format: "csv"
    role: "reference_date_source"
derived_targets:
  - path: "work/derived/crf/"
    expected_content: "CRF parser JSON outputs after review"
  - path: "work/derived/edc/"
    expected_content: "EDC data dictionary parser JSON outputs after review"
  - path: "work/derived/study-context/"
    expected_content: "Study rule JSON candidates after review"
  - path: "work/mapping/"
    expected_content: "MappingSpec candidates and validation reports"
